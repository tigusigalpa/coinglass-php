name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '22 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PHP code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: php
      - name: Analyze
        uses: github/codeql-action/analyze@v4
