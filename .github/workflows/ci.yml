name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install compatible dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint PHP source and tests
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: vendor/bin/phpunit
